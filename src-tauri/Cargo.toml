[package]
name = "noora-lan-ai-server"
version = "1.0.0"
description = "Noora AI - LAN AI Server Developed by Nadeem"
authors = ["Nadeem"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
custom-protocol = ["tauri/custom-protocol"]
